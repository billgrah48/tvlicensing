spring.application.name=tvlicensing
# ============================================
# TV LICENSING APPLICATION - SETTINGS FILE
# ============================================

# --- H2 IN-MEMORY DATABASE SETTINGS ---

# Gives our H2 database a fixed name so it stays
# consistent every time the app restarts
spring.datasource.url=jdbc:h2:mem:tvlicensingdb

# H2 driver class - tells Spring which database we are using
spring.datasource.driver-class-name=org.h2.Driver

# Default H2 username and password
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / HIBERNATE SETTINGS ---

# create-drop means JPA creates the database tables when the
# app starts and drops them when it stops
# We will change this to "update" later so data persists
spring.jpa.hibernate.ddl-auto=update

# Shows the SQL JPA is running in the console - useful for learning
spring.jpa.show-sql=true

# Formats the SQL so it is readable in the console
spring.jpa.properties.hibernate.format_sql=true

# Tells Hibernate we are using H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- H2 CONSOLE SETTINGS ---
# Enables the H2 browser console so you can see your
# database tables visually at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- THYMELEAF SETTINGS ---
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# --- JPA VIEW SETTING ---
# Disables the open-in-view warning we saw in the console earlier
spring.jpa.open-in-view=false
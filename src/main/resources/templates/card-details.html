<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>TV Licensing - Card Details</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>

<header th:replace="~{fragments :: header}"></header>
<div th:replace="~{fragments :: progress(3)}"></div>

<main>
    <h1>Enter Card Details</h1>
    <p>Do not enter real card details. This is a demo.</p>

    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <img th:src="@{/visa.svg}" alt="Visa" style="height: 40px;" />
        <img th:src="@{/mastercard.svg}" alt="Mastercard" style="height: 40px;" />
    </div>

    <form id="paymentForm" th:action="@{/fine/pay}" th:object="${cardPaymentForm}" method="post">

        <input type="hidden" name="fineId" th:value="${fineId}" />

        <label for="nameOnCard">Name on Card</label>
        <input type="text" id="nameOnCard" name="nameOnCard"
               th:value="*{nameOnCard}"
               placeholder="As it appears on your card" />
        <p style="color:#d32f2f; font-size:14px; margin-top:-15px; margin-bottom:10px;"
           th:if="${#fields.hasErrors('nameOnCard')}"
           th:errors="*{nameOnCard}">Name error</p>

        <label for="cardNumber">Card Number</label>
        <input type="text" id="cardNumber" name="cardNumber"
               th:value="*{cardNumber}"
               placeholder="1234 5678 9012 3456"
               maxlength="19" />
        <p style="color:#d32f2f; font-size:14px; margin-top:-15px; margin-bottom:10px;"
           th:if="${#fields.hasErrors('cardNumber')}"
           th:errors="*{cardNumber}">Card number error</p>

        <label for="expiryDate">Expiry Date</label>
        <input type="text" id="expiryDate" name="expiryDate"
               th:value="*{expiryDate}"
               placeholder="MM/YY"
               maxlength="5" />
        <p style="color:#d32f2f; font-size:14px; margin-top:-15px; margin-bottom:10px;"
           th:if="${#fields.hasErrors('expiryDate')}"
           th:errors="*{expiryDate}">Expiry error</p>

        <label for="cvv">CVV
            <span class="cvv-help">?
                <span class="cvv-tooltip">The 3-digit security code on the back of your card.</span>
            </span>
        </label>
        <input type="text" id="cvv" name="cvv"
               th:value="*{cvv}"
               placeholder="3-digit code"
               maxlength="3" />
        <p style="color:#d32f2f; font-size:14px; margin-top:-15px; margin-bottom:10px;"
           th:if="${#fields.hasErrors('cvv')}"
           th:errors="*{cvv}">CVV error</p>

        <button type="button" class="btn" onclick="document.getElementById('confirmModal').classList.add('active')">
            Confirm Payment
        </button>

    </form>

    <a href="/" class="btn-secondary" style="margin-top: 15px; display: inline-block;">Cancel</a>
</main>

<div id="confirmModal" class="modal-overlay">
    <div class="modal">
        <h2>Confirm Payment</h2>
        <p>Are you sure you want to submit this payment? Please check your card details before confirming.</p>
        <div class="modal-buttons">
            <button class="btn" onclick="document.getElementById('cardNumber').value = document.getElementById('cardNumber').value.replace(/\s/g, ''); document.getElementById('paymentForm').submit();">Yes, Pay Now</button>
            <button class="btn-secondary" onclick="document.getElementById('confirmModal').classList.remove('active')">Cancel</button>
        </div>
    </div>
</div>

<script>
    document.getElementById('cardNumber').addEventListener('input', function () {
        let value = this.value.replace(/\D/g, '').slice(0, 16);
        this.value = value.replace(/(.{4})/g, '$1 ').trim();
    });

    document.getElementById('expiryDate').addEventListener('input', function () {
        let value = this.value.replace(/\D/g, '');
        if (value.length >= 2) {
            value = value.slice(0, 2) + '/' + value.slice(2, 4);
        }
        this.value = value;
    });
</script>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>TV Licensing - Card Details</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>

<header th:replace="~{fragments :: header}"></header>

<main>
    <h1>Enter Card Details</h1>
    <p>Do not enter real card details...</p>

    <form th:action="@{/fine/pay}" th:object="${cardPaymentForm}" method="post">

        <input type="hidden" name="fineId" th:value="${fineId}" />

        <label for="nameOnCard">Name on Card</label>
        <input type="text" id="nameOnCard" name="nameOnCard"
               th:value="*{nameOnCard}"
               placeholder="As it appears on your card" />
        <p style="color:#d32f2f; font-size:14px; margin-top:-15px; margin-bottom:10px;"
           th:if="${#fields.hasErrors('nameOnCard')}"
           th:errors="*{nameOnCard}">Name error</p>

        <label for="cardNumber">Card Number</label>
        <input type="text" id="cardNumber" name="cardNumber"
               th:value="*{cardNumber}"
               placeholder="16-digit card number"
               maxlength="16" />
        <p style="color:#d32f2f; font-size:14px; margin-top:-15px; margin-bottom:10px;"
           th:if="${#fields.hasErrors('cardNumber')}"
           th:errors="*{cardNumber}">Card number error</p>

        <label for="expiryDate">Expiry Date</label>
        <input type="text" id="expiryDate" name="expiryDate"
               th:value="*{expiryDate}"
               placeholder="MM/YY"
               maxlength="5" />
        <p style="color:#d32f2f; font-size:14px; margin-top:-15px; margin-bottom:10px;"
           th:if="${#fields.hasErrors('expiryDate')}"
           th:errors="*{expiryDate}">Expiry error</p>

        <label for="cvv">CVV</label>
        <input type="text" id="cvv" name="cvv"
               th:value="*{cvv}"
               placeholder="3-digit code"
               maxlength="3" />
        <p style="color:#d32f2f; font-size:14px; margin-top:-15px; margin-bottom:10px;"
           th:if="${#fields.hasErrors('cvv')}"
           th:errors="*{cvv}">CVV error</p>

        <button type="submit" class="btn">Confirm Payment</button>

    </form>

    <br/>
    <a href="/">Cancel</a>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>

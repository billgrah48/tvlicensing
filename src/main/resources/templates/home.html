<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>TV Licensing - Pay a Fine</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>

<header th:replace="~{fragments :: header}"></header>
<div th:replace="~{fragments :: progress(1)}"></div>

<main>
    <h1>Pay a TV Licence Fine</h1>
    <p>Enter your fine reference number and postcode to find your fine.</p>

    <form th:action="@{/fine/lookup}" method="post">

        <label for="fineReference">Fine Reference Number</label>
        <input type="text" id="fineReference" name="fineReference"
               value="REF-" required />
        <script>
            const input = document.getElementById('fineReference');
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
        </script>

        <label for="postcode">Postcode</label>
        <input type="text" id="postcode" name="postcode"
               placeholder="e.g. BT1 1AA" required />

        <button type="submit" class="btn">Find My Fine</button>

    </form>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>

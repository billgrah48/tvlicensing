<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <title>TV Licensing - Register</title>

    <link rel="stylesheet" th:href="@{/style.css}" />
</head>

<body>

<header th:replace="~{fragments :: header}"></header>

<main>
    <h1>Register for an Online Account</h1>

    <p>Create an account to manage your TV Licence online.</p>

    <!-- REGISTRATION FORM-->
    <form th:action="@{/register}" th:object="${customer}" method="post">

        <!-- Shows an error message if one was sent back from the controller -->
        <div class="alert" th:if="${error}" style="border-left-color: #d32f2f; background-color: #fdecea;">
            <p th:text="${error}">Error message here</p>
        </div>

    <!-- Full name field -->
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName"
               th:value="*{fullName}"
               placeholder="Enter your full name"
               minlength="3"
               pattern="[A-Za-z]+ [A-Za-z]+.*"
               title="Please enter your first and last name" required/>
        <!-- Shows the server side validation error for this field if present -->
        <p style="color:#d32f2f; font-size:14px; margin-top:-15px; margin-bottom:10px;"
           th:if="${#fields.hasErrors('fullName')}"
           th:errors="*{fullName}">Name error</p>

        <!-- Email address field -->
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               th:value="*{email}"
               placeholder="Enter your email address" required />
        <p style="color:#d32f2f; font-size:14px; margin-top:-15px; margin-bottom:10px;"
           th:if="${#fields.hasErrors('email')}"
           th:errors="*{email}">Email error</p>

        <!-- ADDRESS LINE 1-->
        <label for="addressLine1">Address Line 1</label>
        <input type="text"
               id="addressLine1"
               name="addressLine1"
               th:value="*{addressLine1}"
               placeholder="House number and street name"
               required />
        <p style="color:#d32f2f; font-size:14px; margin-top:-15px; margin-bottom:10px;"
           th:if="${#fields.hasErrors('addressLine1')}"
           th:errors="*{addressLine1}">Address error</p>

        <!-- ADDRESS LINE 2 not required-->
        <label for="addressLine2">Address Line 2 (optional)</label>
        <input type="text"
               id="addressLine2"
               name="addressLine2"
               placeholder="Apartment, flat, suite etc." />

        <!-- TOWN OR CITY -->
        <label for="city">Town or City</label>
        <input type="text"
               id="city"
               name="city"
               th:value="*{city}"
               placeholder="Enter your town or city"
               required />
        <p style="color:#d32f2f; font-size:14px; margin-top:-15px; margin-bottom:10px;"
           th:if="${#fields.hasErrors('city')}"
           th:errors="*{city}">City error</p>

        <!-- POSTCODE -->
        <label for="postcode">Postcode</label>
        <input type="text"
               id="postcode"
               name="postcode"
               th:value="*{postcode}"
               placeholder="e.g. BT1 1AA"
               required />
        <p style="color:#d32f2f; font-size:14px; margin-top:-15px; margin-bottom:10px;"
           th:if="${#fields.hasErrors('postcode')}"
           th:errors="*{postcode}">Postcode error</p>

        <!-- Password field -->
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Create a password (minimum 8 characters)" required />
        <p style="color:#d32f2f; font-size:14px; margin-top:-15px; margin-bottom:10px;"
           th:if="${#fields.hasErrors('password')}"
           th:errors="*{password}">Password error</p>

        <!-- Confirm password field -->
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword"
               placeholder="Repeat your password" required />

        <!-- Submit button -->
        <button type="submit" class="btn">Create Account</button>

    </form>

    <!-- Link back to login for users who already have an account -->
    <p style="margin-top: 20px;">Already have an account?
        <a href="/login">Sign in here</a>
    </p>

</main>

<!-- Pulls in the shared footer from fragments.html -->
<footer th:replace="~{fragments :: footer}"></footer>

</body>

</html>

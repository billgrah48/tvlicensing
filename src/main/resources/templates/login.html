<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>TV Licensing - Sign In</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>

<header th:replace="~{fragments :: header}"></header>

<main>
    <h1>Sign In to Your Account</h1>

    <!-- Success message shown after successful registration -->
    <div class="alert" th:if="${success}"
         style="border-left-color: #2e7d32; background-color: #f1f8f1;">
        <p th:text="${success}">Success message</p>
    </div>

    <!-- Error message shown after failed login -->
    <div class="alert" th:if="${error}"
         style="border-left-color: #d32f2f; background-color: #fdecea;">
        <p th:text="${error}">Error message</p>
    </div>

    <!-- LOGIN FORM-->
    <form th:action="@{/login}" method="post">

        <label for="username">Email Address</label>
        <input type="email" id="username" name="username"
               placeholder="Enter your email address" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Enter your password" required />

        <button type="submit" class="btn">Sign In</button>

    </form>

    <p style="margin-top: 20px;">Don't have an account?
        <a href="/register">Register here</a>
    </p>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
